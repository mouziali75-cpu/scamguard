                      "REQUEST_INSTALL_PACKAGES", "BIND_NOTIFICATION_LISTENER_SERVICE", "READ_CALL_LOG", "MANAGE_EXTERNAL_STORAGE", "WRITE_SECURE_SETTINGS"));
              private static final HashSet<String> RISK1 = new HashSet<>(Arrays.asList(
                      "READ_CONTACTS", "RECORD_AUDIO", "CALL_PHONE", "READ_PHONE_STATE", "ACCESS_FINE_LOCATION", "CAMERA", "PROCESS_OUTGOING_CALLS",
                      "READ_EXTERNAL_STORAGE", "GET_ACCOUNTS", "USE_BIOMETRIC"));

              static String ext(String low) {
                  int i = low.lastIndexOf('.');
