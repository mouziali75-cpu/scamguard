              // ================= dialogs =================
              /** returns {page, actionsRow} */
              LinearLayout[] shell(final Dialog d, String title) {
                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setBackgroundColor(C_BG);
                  page.setLayoutDirection(S.rtl() ? View.LAYOUT_DIRECTION_RTL : View.LAYOUT_DIRECTION_LTR);
                  LinearLayout head = new LinearLayout(this);
                  head.setOrientation(LinearLayout.HORIZONTAL);
                  head.setGravity(Gravity.CENTER_VERTICAL);
                  head.setBackgroundColor(C_BAR);
                  head.setPadding(dp(4), 0, dp(8), 0);
                  ImageView back = iconBtn(R.drawable.ic_back, new View.OnClickListener() {
                      @Override public void onClick(View v) { d.dismiss(); }
                  });
                  if (S.rtl()) back.setScaleX(-1f);
                  head.addView(back, new LinearLayout.LayoutParams(dp(46), dp(46)));
                  TextView tv = text(title, 17, C_TEXT);
                  tv.setSingleLine(true);
                  tv.setEllipsize(android.text.TextUtils.TruncateAt.END);
                  tv.setPadding(dp(6), 0, dp(6), 0);
                  head.addView(tv, new LinearLayout.LayoutParams(0, -2, 1f));
                  LinearLayout actions = new LinearLayout(this);
                  actions.setOrientation(LinearLayout.HORIZONTAL);
                  actions.setGravity(Gravity.CENTER_VERTICAL);
                  head.addView(actions, new LinearLayout.LayoutParams(-2, -2));
                  page.addView(head, new LinearLayout.LayoutParams(-1, dp(52)));
                  d.setContentView(page);
                  return new LinearLayout[]{page, actions};
              }

              Dialog newFull() {
                  Dialog d = new Dialog(this, android.R.style.Theme_DeviceDefault_NoActionBar);
                  return d;
              }

              void showFull(Dialog d) {
                  d.show();
                  if (d.getWindow() != null) {
                      d.getWindow().setLayout(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                      d.getWindow().setBackgroundDrawable(new ColorDrawable(C_BG));
                      d.getWindow().setStatusBarColor(C_BAR);
                      d.getWindow().setNavigationBarColor(C_BG);
                  }
              }

              TextView actionText(String s, View.OnClickListener l) {
                  TextView t = text(s, 14, C_ACCENT);
                  t.setPadding(dp(10), dp(8), dp(10), dp(8));
                  t.setOnClickListener(l);
                  return t;
              }

              void showTabs() {
                  captureThumb(cur);
                  final Dialog d = newFull();
                  LinearLayout[] sh = shell(d, S.t("tabs") + " (" + tabs.size() + ")");
                  final EditText q = new EditText(this);
                  q.setSingleLine(true);
                  q.setHint(S.t("tabs_search"));
                  q.setHintTextColor(C_MUTED);
                  q.setTextColor(C_TEXT);
                  q.setTextSize(14);
                  q.setBackground(rounded(C_PILL, 22));
                  q.setPadding(dp(16), dp(10), dp(16), dp(10));
                  LinearLayout.LayoutParams qlp = new LinearLayout.LayoutParams(-1, -2);
                  qlp.setMargins(dp(12), dp(10), dp(12), dp(4));
                  sh[0].addView(q, qlp);
                  final LinearLayout grid = new LinearLayout(this);
                  grid.setOrientation(LinearLayout.VERTICAL);
                  grid.setPadding(dp(6), dp(6), dp(6), dp(20));
                  ScrollView sv = new ScrollView(this);
                  sv.addView(grid);
                  sh[0].addView(sv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  final Runnable[] fill = new Runnable[1];
                  fill[0] = new Runnable() {
                      @Override public void run() {
                          grid.removeAllViews();
                          String f = q.getText().toString().toLowerCase().trim();
                          ArrayList<Tab> shown = new ArrayList<>();
                          for (Tab t : tabs) {
                              if (f.isEmpty() || tabTitle(t).toLowerCase().contains(f) || (t.url != null && t.url.toLowerCase().contains(f))) shown.add(t);
                          }
                          LinearLayout row = null;
                          for (int i = 0; i < shown.size(); i++) {
                              final Tab t = shown.get(i);
                              if (i % 2 == 0) {
                                  row = new LinearLayout(MainActivity.this);
                                  row.setOrientation(LinearLayout.HORIZONTAL);
                                  row.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);
                                  grid.addView(row, new LinearLayout.LayoutParams(-1, -2));
                              }
                              LinearLayout card = new LinearLayout(MainActivity.this);
                              card.setOrientation(LinearLayout.VERTICAL);
                              card.setPadding(dp(8), dp(6), dp(8), dp(8));
                              card.setBackground(rounded(t == cur ? 0xFF3A2F66 : C_SHEET, 14));
                              LinearLayout head = new LinearLayout(MainActivity.this);
                              head.setOrientation(LinearLayout.HORIZONTAL);
                              head.setGravity(Gravity.CENTER_VERTICAL);
                              TextView title = text(tabTitle(t), 12, C_TEXT);
                              title.setSingleLine(true);
                              title.setEllipsize(android.text.TextUtils.TruncateAt.END);
                              head.addView(title, new LinearLayout.LayoutParams(0, -2, 1f));
                              ImageView x = new ImageView(MainActivity.this);
                              x.setImageResource(R.drawable.ic_close);
                              x.setColorFilter(C_MUTED);
                              x.setPadding(dp(5), dp(5), dp(5), dp(5));
                              x.setOnClickListener(new View.OnClickListener() {
                                  @Override public void onClick(View v) { closeTab(t); fill[0].run(); }
                              });
                              head.addView(x, new LinearLayout.LayoutParams(dp(30), dp(30)));
                              card.addView(head, new LinearLayout.LayoutParams(-1, -2));
                              ImageView th = new ImageView(MainActivity.this);
                              th.setScaleType(ImageView.ScaleType.CENTER_CROP);
                              th.setBackground(rounded(C_PILL, 10));
                              if (t.thumb != null) th.setImageBitmap(t.thumb);
                              LinearLayout.LayoutParams tlp = new LinearLayout.LayoutParams(-1, dp(150));
                              tlp.setMargins(0, dp(6), 0, 0);
                              card.addView(th, tlp);
                              card.setOnClickListener(new View.OnClickListener() {
                                  @Override public void onClick(View v) { d.dismiss(); switchTo(t); }
                              });
                              LinearLayout.LayoutParams clp = new LinearLayout.LayoutParams(0, -2, 1f);
                              clp.setMargins(dp(5), dp(5), dp(5), dp(5));
                              row.addView(card, clp);
                          }
                          if (shown.size() % 2 == 1 && row != null) row.addView(new View(MainActivity.this), new LinearLayout.LayoutParams(0, 1, 1f));
                      }
                  };
                  fill[0].run();
                  q.addTextChangedListener(new android.text.TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence c, int a, int b, int n) { }
                      @Override public void onTextChanged(CharSequence c, int a, int b, int n) { fill[0].run(); }
                      @Override public void afterTextChanged(android.text.Editable e) { }
                  });
                  sh[1].addView(iconBtn(R.drawable.ic_plus, new View.OnClickListener() {
                      @Override public void onClick(View v) { d.dismiss(); newTab(null, true); }
                  }), new LinearLayout.LayoutParams(dp(44), dp(44)));
                  sh[1].addView(actionText(S.t("close_all"), new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          for (Tab t : new ArrayList<>(tabs)) closeTab(t);
                          d.dismiss();
                      }
                  }));
                  showFull(d);
              }

              void showList(String title, final String key) {
                  final Dialog d = newFull();
                  LinearLayout[] sh = shell(d, title);
                  final LinearLayout list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  ScrollView sv = new ScrollView(this);
                  sv.addView(list);
                  sh[0].addView(sv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  final Runnable[] fill = new Runnable[1];
                  fill[0] = new Runnable() {
                      @Override public void run() {
                          list.removeAllViews();
                          final JSONArray arr = getArr(key);
                          if (arr.length() == 0) {
                              TextView e = text(S.t("empty_list"), 15, C_MUTED);
                              e.setGravity(Gravity.CENTER);
                              e.setPadding(0, dp(60), 0, 0);
                              list.addView(e, new LinearLayout.LayoutParams(-1, -2));
                              return;
                          }
                          for (int i = 0; i < arr.length(); i++) {
                              final JSONObject o = arr.optJSONObject(i);
                              if (o == null) continue;
                              final int idx = i;
                              final String u = o.optString("u");
                              LinearLayout row = new LinearLayout(MainActivity.this);
                              row.setOrientation(LinearLayout.VERTICAL);
                              row.setPadding(dp(16), dp(10), dp(16), dp(10));
                              row.setBackground(ripple());
                              TextView a = text(o.optString("t"), 15, C_TEXT);
                              a.setSingleLine(true);
                              a.setEllipsize(android.text.TextUtils.TruncateAt.END);
                              TextView b = text(pretty(u), 12, C_MUTED);
                              b.setSingleLine(true);
                              b.setEllipsize(android.text.TextUtils.TruncateAt.END);
                              row.addView(a);
                              row.addView(b);
                              row.setOnClickListener(new View.OnClickListener() {
                                  @Override public void onClick(View v) { d.dismiss(); navigate(cur, u, true); }
                              });
                              row.setOnLongClickListener(new View.OnLongClickListener() {
                                  @Override public boolean onLongClick(View v) {
                                      new AlertDialog.Builder(MainActivity.this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                                              .setMessage(S.t("delete_q"))
                                              .setNegativeButton(S.t("cancel"), null)
                                              .setPositiveButton(S.t("yes"), new android.content.DialogInterface.OnClickListener() {
                                                  @Override public void onClick(android.content.DialogInterface di, int w) {
                                                      JSONArray cur2 = getArr(key);
                                                      cur2.remove(idx);
                                                      prefs.edit().putString(key, cur2.toString()).apply();
                                                      fill[0].run();
                                                  }
                                              }).show();
                                      return true;
                                  }
                              });
                              list.addView(row, new LinearLayout.LayoutParams(-1, -2));
                          }
                      }
                  };
                  fill[0].run();
                  sh[1].addView(actionText(S.t("clear_all"), new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          prefs.edit().putString(key, "[]").apply();
                          fill[0].run();
                      }
                  }));
                  showFull(d);
              }

              void showReport() {
                  String u = realUrl();
