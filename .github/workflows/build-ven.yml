                                      else if (mal + sus >= 1) r.add(1, "sc_vt_some", (mal + sus) + "/" + tot);
                                      else r.add(0, "sc_vt_clean", tot + "");
                                  } else r.add(0, "sc_vt_unknown", null);
                              }
                          }
                          con.disconnect();
                      } catch (Exception e) { /* offline: local checks only */ }
                  }
                  return r;
              }
          }
