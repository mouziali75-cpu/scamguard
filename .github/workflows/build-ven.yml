                      ss.setSpan(new StyleSpan(Typeface.BOLD), q.length(), shown.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  TextView tv = text("", 15, C_TEXT);
                  tv.setText(ss);
                  tv.setSingleLine(true);
                  tv.setEllipsize(android.text.TextUtils.TruncateAt.END);
