                      int tw = 360, th = 420;
                      float sc = tw / (float) t.web.getWidth();
                      Bitmap b = Bitmap.createBitmap(tw, th, Bitmap.Config.ARGB_8888);
                      android.graphics.Canvas c = new android.graphics.Canvas(b);
                      c.drawColor(0xFF1A1626);
                      c.scale(sc, sc);
                      t.web.draw(c);
                      t.thumb = b;
                  } catch (Throwable e) { /* ignore */ }
              }

