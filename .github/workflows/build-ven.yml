              // ================= address-bar suggestions (like Chrome) =================
              final Runnable sugNet = new Runnable() {
                  @Override public void run() {
                      final String q = sugQuery;
                      final int seq = sugSeq;
                      final String eng = sEngine;
                      new Thread(new Runnable() {
                          @Override public void run() {
                              final ArrayList<String> res = fetchSuggest(q, eng);
                              ui.post(new Runnable() {
                                  @Override public void run() {
                                      if (seq != sugSeq || !urlBox.hasFocus() || !sSuggest) return;
                                      renderSug(q, localSug(q), res);
                                  }
                              });
                          }
                      }).start();
                  }
              };

              void hideSug() {
                  sugSeq++;
                  ui.removeCallbacks(sugNet);
                  if (sugScroll != null) sugScroll.setVisibility(View.GONE);
              }

              void refreshSug() {
                  if (sugScroll == null) return;
                  if (!sSuggest || !urlBox.hasFocus()) { hideSug(); return; }
                  String q = sugTyped ? urlBox.getText().toString().trim() : "";
                  sugSeq++;
                  ui.removeCallbacks(sugNet);
                  renderSug(q, localSug(q), new ArrayList<String>());
                  if (!q.isEmpty()) {
                      sugQuery = q;
                      ui.postDelayed(sugNet, 140);
                  }
              }

              boolean urlLike(String q) {
                  String l = q.toLowerCase();
                  return l.startsWith("http://") || l.startsWith("https://") || (!q.contains(" ") && q.contains(".") && !q.startsWith(".") && !q.endsWith("."));
              }

              ArrayList<Sug> localSug(String q) {
                  ArrayList<Sug> out = new ArrayList<>();
                  HashSet<String> seen = new HashSet<>();
                  String lq = q.toLowerCase();
                  for (int pass = 0; pass < 2; pass++) {
                      JSONArray a = getArr(pass == 0 ? "bm" : "hist");
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.optJSONObject(i);
                          if (o == null) continue;
                          String u = o.optString("u"), tt = o.optString("t");
                          if (u.isEmpty() || u.startsWith(Pages.BASE)) continue;
                          if (!lq.isEmpty() && !u.toLowerCase().contains(lq) && !tt.toLowerCase().contains(lq)) continue;
                          if (lq.isEmpty() && pass == 0) break;           // empty box: only recent history
                          if (!seen.add(u)) continue;
                          Sug s = new Sug();
                          s.text = u;
                          s.sub = pretty(u);
                          s.kind = pass == 0 ? 2 : 1;
                          s.text = u;
                          out.add(s);
                          if (out.size() >= (lq.isEmpty() ? 8 : 4)) return withTitles(out, a);
                      }
                  }
                  return out;
              }

              private ArrayList<Sug> withTitles(ArrayList<Sug> out, JSONArray a) { return out; }

              void renderSug(String q, ArrayList<Sug> local, ArrayList<String> net) {
                  if (sugScroll == null) return;
                  sugList.removeAllViews();
                  HashSet<String> seen = new HashSet<>();
                  if (!q.isEmpty()) {
                      Sug s = new Sug();
                      s.text = q;
                      s.sub = "";
                      s.kind = urlLike(q) ? 3 : 0;
                      seen.add(q.toLowerCase());
                      sugList.addView(sugRow(s, q));
                  }
                  for (Sug s : local) {
                      seen.add(s.text.toLowerCase());
                      sugList.addView(sugRow(s, q));
                  }
                  int n = 0;
                  for (String t : net) {
                      if (n >= 6 || !seen.add(t.toLowerCase())) continue;
                      Sug s = new Sug();
                      s.text = t;
                      s.sub = "";
                      s.kind = 0;
                      sugList.addView(sugRow(s, q));
                      n++;
                  }
                  sugScroll.setVisibility(sugList.getChildCount() > 0 ? View.VISIBLE : View.GONE);
                  sugScroll.bringToFront();
              }

              View sugRow(final Sug s, String q) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setMinimumHeight(dp(52));
                  row.setPadding(dp(14), dp(4), dp(2), dp(4));
                  row.setBackground(ripple());
                  ImageView ic = new ImageView(this);
                  ic.setImageResource(s.kind == 1 ? R.drawable.ic_history : s.kind == 2 ? R.drawable.ic_star
                          : s.kind == 3 ? R.drawable.ic_globe : R.drawable.ic_search);
                  ic.setColorFilter(s.kind == 2 ? C_ACCENT : C_MUTED);
                  row.addView(ic, new LinearLayout.LayoutParams(dp(22), dp(22)));
                  LinearLayout mid = new LinearLayout(this);
                  mid.setOrientation(LinearLayout.VERTICAL);
                  mid.setPadding(dp(16), 0, dp(8), 0);
                  String shown = (s.kind == 1 || s.kind == 2) ? pretty(s.text) : s.text;
                  SpannableString ss = new SpannableString(shown);
