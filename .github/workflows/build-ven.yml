              static String glob2re(String g) {
                  g = g.trim();
                  if (g.equals("<all_urls>")) return "^https?://.*$";
                  if (g.length() > 2 && g.startsWith("/") && g.endsWith("/")) return g.substring(1, g.length() - 1);
                  StringBuilder sb = new StringBuilder("^");
