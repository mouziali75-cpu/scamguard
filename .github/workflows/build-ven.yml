              void analyze(final Tab t, final String value) {
                  ui.post(new Runnable() {
                      @Override public void run() {
                          if (!tabs.contains(t) || value == null || value.equals("null")) return;
                          try {
                              Object o = new JSONTokener(value).nextValue();
                              if (!(o instanceof String)) return;
                              JSONObject j = new JSONObject((String) o);
                              String u = t.url;
                              Uri p = Uri.parse(u);
                              if (p.getHost() == null) return;
                              String host = p.getHost().toLowerCase();
                              boolean trusted = Shield.isTrusted(host);
                              if (j.optBoolean("rta") && sNsfw && !trusted && !allowed.contains(host)) {
                                  threatsBlocked++;
                                  load(t, Pages.BASE + "blocked?u=" + Pages.enc(u) + "&r=1");
                                  return;
                              }
                              if (t != cur) return;
                              if (sAnti && j.optBoolean("scam") && !trusted) showBanner(S.t("banner_scam"), C_BAD);
                              else if (sAnti && (j.optBoolean("pw") || j.optBoolean("cc")) && !trusted)
                                  showBanner(S.t("banner_unknown"), 0xFFB36B00);
                          } catch (Exception e) { /* ignore */ }
                      }
                  });
              }

              void addHistory(String title, String url) {
                  JSONArray a = getArr("hist");
                  JSONObject first = a.length() > 0 ? a.optJSONObject(0) : null;
                  if (first != null && url.equals(first.optString("u"))) return;
                  try {
                      JSONObject o = new JSONObject();
                      o.put("t", title == null || title.isEmpty() ? pretty(url) : title);
                      o.put("u", url);
                      prefs.edit().putString("hist", prepend(a, o, 300).toString()).apply();
                  } catch (Exception e) { /* ignore */ }
              }

              // ================= downloads =================
              void startDownload(final String url, final String ua, String cd, final String mime) {
                  if (!isWeb(url)) { toast(S.t("dl_unsupported")); return; }
                  final String name = URLUtil.guessFileName(url, cd, mime);
                  String low = name.toLowerCase();
                  String ext = null;
                  for (String e : Shield.DANGEROUS_EXT) if (low.endsWith(e)) ext = e;
                  if (ext != null && sAnti) {
                      new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                              .setTitle(S.t("dl_title"))
                              .setMessage(S.t("dl_msg").replace("{e}", ext))
                              .setNegativeButton(S.t("cancel"), null)
                              .setPositiveButton(S.t("yes"), new android.content.DialogInterface.OnClickListener() {
                                  @Override public void onClick(android.content.DialogInterface d, int w) { doDownload(url, ua, name, mime); }
                              }).show();
                  } else {
                      doDownload(url, ua, name, mime);
                  }
              }

              void doDownload(String url, String ua, String name, String mime) {
                  if (Build.VERSION.SDK_INT <= 28
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 5);
                      toast(S.t("dl_perm"));
                      return;
                  }
                  try {
                      DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                      if (mime != null && !mime.isEmpty()) r.setMimeType(mime);
                      String ck = CookieManager.getInstance().getCookie(url);
                      if (ck != null) r.addRequestHeader("cookie", ck);
                      if (ua != null) r.addRequestHeader("User-Agent", ua);
                      r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      dm.enqueue(r);
                      toast(S.t("dl_started"));
                  } catch (Exception e) {
                      toast(S.t("dl_unsupported"));
                  }
              }

