              // ================= scanning =================
              static void onDone(final MainActivity a, final long id) {
                  if (a.prefs.contains("scan_" + id) || scanning.contains(id)) return;
                  DownloadManager dm = (DownloadManager) a.getSystemService(Context.DOWNLOAD_SERVICE);
                  Cursor c = null;
                  try {
                      c = dm.query(new DownloadManager.Query().setFilterById(id));
                      if (c == null || !c.moveToFirst()) return;
                      if (c.getInt(c.getColumnIndex(DownloadManager.COLUMN_STATUS)) != DownloadManager.STATUS_SUCCESSFUL) return;
                      String title = c.getString(c.getColumnIndex(DownloadManager.COLUMN_TITLE));
                      String src = c.getString(c.getColumnIndex(DownloadManager.COLUMN_URI));
                      scanFile(a, id, title == null ? "file" : title, src, true);
                  } catch (Exception e) { /* ignore */ } finally { if (c != null) c.close(); }
              }

              static void scanFile(final MainActivity a, final long id, final String name, final String src, boolean wait) {
                  if (scanning.contains(id)) return;
                  scanning.add(id);
                  a.ui.post(new Runnable() { @Override public void run() { if (refreshPage != null) refreshPage.run(); } });
                  final AlertDialog[] dlg = {null};
                  if (wait && !a.isFinishing()) {
                      LinearLayout w = new LinearLayout(a);
                      w.setOrientation(LinearLayout.VERTICAL);
                      w.setGravity(Gravity.CENTER_HORIZONTAL);
                      w.setPadding(a.dp(24), a.dp(14), a.dp(24), a.dp(6));
                      w.addView(new android.widget.ProgressBar(a), new LinearLayout.LayoutParams(a.dp(44), a.dp(44)));
                      TextView t = a.text(S.t("scan_wait"), 15, MainActivity.C_TEXT);
                      t.setGravity(Gravity.CENTER);
                      t.setPadding(0, a.dp(14), 0, a.dp(6));
                      w.addView(t, new LinearLayout.LayoutParams(-1, -2));
                      TextView n = a.text(name, 12, MainActivity.C_MUTED);
                      n.setGravity(Gravity.CENTER);
                      n.setSingleLine(true);
                      n.setEllipsize(android.text.TextUtils.TruncateAt.MIDDLE);
                      w.addView(n, new LinearLayout.LayoutParams(-1, -2));
                      try {
                          dlg[0] = new AlertDialog.Builder(a, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                                  .setTitle(S.t("scan_title")).setView(w).setCancelable(true).create();
                          dlg[0].show();
                      } catch (Exception e) { dlg[0] = null; }
                  }
                  new Thread(new Runnable() {
                      @Override public void run() {
                          DlScan.Result r;
                          try { r = DlScan.scan(a, id, name, src); } catch (Throwable e) { r = new DlScan.Result(); r.add(0, "sc_noread", null); }
                          final DlScan.Result rr = r;
                          a.prefs.edit().putString("scan_" + id, rr.pack()).apply();
                          scanning.remove(id);
                          a.ui.post(new Runnable() {
                              @Override public void run() {
                                  boolean shown = dlg[0] != null && dlg[0].isShowing();
                                  try { if (dlg[0] != null) dlg[0].dismiss(); } catch (Exception e) { /* ignore */ }
                                  if (refreshPage != null) refreshPage.run();
                                  if (a.isFinishing()) return;
                                  if (shown || rr.level >= 1) verdict(a, id, name, rr);
                                  else a.toast("✅ " + name + ": " + S.t("sc_safe"));
                              }
                          });
                      }
                  }).start();
              }

              static String why(String[] w) { return S.t(w[1]).replace("{p}", w[2]); }

              static void verdict(final MainActivity a, final long id, final String name, final DlScan.Result r) {
                  StringBuilder m = new StringBuilder(name).append("\n");
                  for (int lv = 2; lv >= 0; lv--) {
                      for (String[] w : r.why) if (w[0].equals(String.valueOf(lv))) m.append("\n").append(lv == 2 ? "⛔ " : lv == 1 ? "⚠️ " : "• ").append(why(w));
                  }
                  if (r.why.isEmpty()) m.append("\n• ").append(S.t("sc_safe"));
                  if (!r.sha.isEmpty()) m.append("\n\n").append(S.t("sc_sha")).append(": ").append(r.sha.substring(0, 16)).append("…");
                  String title = r.level == 2 ? "⛔ " + S.t("sc_bad") : r.level == 1 ? "⚠️ " + S.t("sc_warn") : "✅ " + S.t("sc_safe");
                  AlertDialog.Builder b = new AlertDialog.Builder(a, android.R.style.Theme_DeviceDefault_Dialog_Alert).setTitle(title).setMessage(m.toString());
                  b.setNegativeButton(S.t("sc_close"), null);
                  final android.content.DialogInterface.OnClickListener del = new android.content.DialogInterface.OnClickListener() {
                      @Override public void onClick(android.content.DialogInterface di, int w) { delete(a, id); }
                  };
                  final android.content.DialogInterface.OnClickListener open = new android.content.DialogInterface.OnClickListener() {
                      @Override public void onClick(android.content.DialogInterface di, int w) { openFile(a, id, null); }
                  };
                  if (r.level == 2) { b.setPositiveButton(S.t("sc_delete"), del); b.setNeutralButton(S.t("sc_open_any"), open); }
                  else if (r.level == 1) { b.setPositiveButton(S.t("sc_open"), open); b.setNeutralButton(S.t("sc_delete"), del); }
                  else b.setPositiveButton(S.t("sc_open"), open);
                  try { b.show(); } catch (Exception e) { /* ignore */ }
              }

              // ================= file actions =================
              static void openFile(MainActivity a, long id, String mime) {
                  try {
                      DownloadManager dm = (DownloadManager) a.getSystemService(Context.DOWNLOAD_SERVICE);
                      Uri u = dm.getUriForDownloadedFile(id);
                      String mt = mime != null && !mime.isEmpty() ? mime : dm.getMimeTypeForDownloadedFile(id);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(u, mt == null ? "*/*" : mt);
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      a.startActivity(i);
                  } catch (Exception e) { a.toast(S.t("dl_noopen")); }
              }

              static void shareFile(MainActivity a, long id, String mime) {
                  try {
                      DownloadManager dm = (DownloadManager) a.getSystemService(Context.DOWNLOAD_SERVICE);
                      Uri u = dm.getUriForDownloadedFile(id);
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType(mime == null || mime.isEmpty() ? "*/*" : mime);
                      i.putExtra(Intent.EXTRA_STREAM, u);
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      a.startActivity(Intent.createChooser(i, S.t("share_via")));
                  } catch (Exception e) { a.toast(S.t("dl_noopen")); }
              }

              static void delete(MainActivity a, long id) {
                  try {
                      ((DownloadManager) a.getSystemService(Context.DOWNLOAD_SERVICE)).remove(id);
                      a.prefs.edit().remove("scan_" + id).remove("dlsrc_" + id).apply();
                      a.toast(S.t("dl_deleted"));
                  } catch (Exception e) { /* ignore */ }
                  if (refreshPage != null) refreshPage.run();
              }

              // ================= downloads page =================
              static final class Item {
                  long id, size, got, mod;
                  int status, reason;
                  String title = "", uri = "", mime = "", src = "";
              }

              static ArrayList<Item> load(MainActivity a) {
                  ArrayList<Item> out = new ArrayList<>();
                  DownloadManager dm = (DownloadManager) a.getSystemService(Context.DOWNLOAD_SERVICE);
                  Cursor c = null;
                  try {
                      c = dm.query(new DownloadManager.Query());
                      while (c != null && c.moveToNext()) {
                          Item it = new Item();
                          it.id = c.getLong(c.getColumnIndex(DownloadManager.COLUMN_ID));
                          String t = c.getString(c.getColumnIndex(DownloadManager.COLUMN_TITLE));
                          it.title = t == null ? "" : t;
                          String u = c.getString(c.getColumnIndex(DownloadManager.COLUMN_LOCAL_URI));
                          it.uri = u == null ? "" : u;
                          String m = c.getString(c.getColumnIndex(DownloadManager.COLUMN_MEDIA_TYPE));
                          it.mime = m == null ? "" : m;
                          String s = c.getString(c.getColumnIndex(DownloadManager.COLUMN_URI));
                          it.src = s == null ? "" : s;
                          it.size = c.getLong(c.getColumnIndex(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                          it.got = c.getLong(c.getColumnIndex(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                          it.status = c.getInt(c.getColumnIndex(DownloadManager.COLUMN_STATUS));
                          it.reason = c.getInt(c.getColumnIndex(DownloadManager.COLUMN_REASON));
                          it.mod = c.getLong(c.getColumnIndex(DownloadManager.COLUMN_LAST_MODIFIED_TIMESTAMP));
                          out.add(it);
                      }
                  } catch (Exception e) { /* ignore */ } finally { if (c != null) c.close(); }
                  Collections.sort(out, new Comparator<Item>() {
                      @Override public int compare(Item x, Item y) { return x.mod < y.mod ? 1 : x.mod > y.mod ? -1 : 0; }
                  });
                  return out;
              }

              static int cat(Item it) {
                  String m = it.mime == null ? "" : it.mime.toLowerCase(Locale.ROOT), n = it.title.toLowerCase(Locale.ROOT);
                  if (m.startsWith("image/")) return 1;
                  if (m.startsWith("video/")) return 2;
                  if (m.startsWith("audio/")) return 3;
                  if (n.endsWith(".apk") || m.contains("android.package")) return 5;
                  if (m.equals("application/pdf") || m.startsWith("text/") || m.contains("word") || m.contains("excel") || m.contains("powerpoint")
                          || m.contains("officedocument") || m.contains("zip") || n.endsWith(".pdf") || n.endsWith(".txt") || n.endsWith(".docx") || n.endsWith(".xlsx") || n.endsWith(".zip")) return 4;
                  return 6;
              }

