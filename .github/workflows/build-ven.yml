                          .append("\n}).call(window,window,GM_addStyle,GM_getValue,GM_setValue,GM_deleteValue,GM_listValues,GM_xmlhttpRequest,GM_openInTab,GM_log,GM_registerMenuCommand,GM_setClipboard,GM_info);")
                          .append("}catch(e){try{console.log('Ven script error: '+e);}catch(_){}}})();");
                  return b.toString();
              }

              /** ready-to-run scripts of one phase (start = @run-at document-start); each one checks its own @match rules */
              static ArrayList<String> build(Context c, SharedPreferences p, boolean start) {
                  ArrayList<String> out = new ArrayList<>();
                  JSONArray a = list(p);
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject it = a.optJSONObject(i);
                      if (it == null || !it.optBoolean("on", true) || it.optBoolean("start", false) != start) continue;
                      String id = it.optString("id");
                      String js;
                      synchronized (CACHE) {
                          js = CACHE.get(id);
                          if (js == null) {
                              js = wrap(id, it, read(file(c, id)));
                              CACHE.put(id, js);
                          }
                      }
                      out.add(js);
                  }
                  return out;
              }
          }
