              // ----- permissions asked by web pages (camera, microphone, location) -----
              void askPermission(final android.webkit.PermissionRequest r) {
                  final java.util.ArrayList<String> need = new java.util.ArrayList<>();
                  StringBuilder what = new StringBuilder();
                  for (String res : r.getResources()) {
                      if (res.equals(android.webkit.PermissionRequest.RESOURCE_VIDEO_CAPTURE)) { need.add(android.Manifest.permission.CAMERA); what.append(S.t("perm_cam")).append(' '); }
                      else if (res.equals(android.webkit.PermissionRequest.RESOURCE_AUDIO_CAPTURE)) { need.add(android.Manifest.permission.RECORD_AUDIO); what.append(S.t("perm_mic")).append(' '); }
                  }
                  if (need.isEmpty()) { try { r.grant(r.getResources()); } catch (Exception e) { /* ignore */ } return; }
                  String host = r.getOrigin() == null || r.getOrigin().getHost() == null ? "" : r.getOrigin().getHost();
                  try {
                      new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                              .setMessage(S.t("perm_q").replace("{h}", host).replace("{r}", what.toString().trim()))
                              .setNegativeButton(S.t("cancel"), new android.content.DialogInterface.OnClickListener() {
                                  @Override public void onClick(android.content.DialogInterface di, int w) { r.deny(); }
                              })
                              .setOnCancelListener(new android.content.DialogInterface.OnCancelListener() {
                                  @Override public void onCancel(android.content.DialogInterface di) { r.deny(); }
                              })
                              .setPositiveButton(S.t("yes"), new android.content.DialogInterface.OnClickListener() {
                                  @Override public void onClick(android.content.DialogInterface di, int w) {
                                      boolean missing = false;
                                      for (String pm : need) if (checkSelfPermission(pm) != PackageManager.PERMISSION_GRANTED) missing = true;
                                      if (!missing) r.grant(r.getResources());
                                      else { pendingPerm = r; requestPermissions(need.toArray(new String[0]), 78); }
                                  }
                              }).show();
                  } catch (Exception e) { r.deny(); }
              }

              void askGeo(final String origin, final android.webkit.GeolocationPermissions.Callback cb) {
                  String host = hostOfUrl(origin);
                  try {
                      new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                              .setMessage(S.t("perm_q").replace("{h}", host).replace("{r}", S.t("perm_loc")))
                              .setNegativeButton(S.t("cancel"), new android.content.DialogInterface.OnClickListener() {
                                  @Override public void onClick(android.content.DialogInterface di, int w) { cb.invoke(origin, false, false); }
                              })
                              .setOnCancelListener(new android.content.DialogInterface.OnCancelListener() {
                                  @Override public void onCancel(android.content.DialogInterface di) { cb.invoke(origin, false, false); }
                              })
                              .setPositiveButton(S.t("yes"), new android.content.DialogInterface.OnClickListener() {
                                  @Override public void onClick(android.content.DialogInterface di, int w) {
                                      if (checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) cb.invoke(origin, true, false);
                                      else { pendingGeo = cb; pendingGeoOrigin = origin; requestPermissions(new String[]{android.Manifest.permission.ACCESS_FINE_LOCATION}, 79); }
                                  }
                              }).show();
                  } catch (Exception e) { cb.invoke(origin, false, false); }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  boolean ok = res.length > 0;
                  for (int g : res) if (g != PackageManager.PERMISSION_GRANTED) ok = false;
                  if (code == 78 && pendingPerm != null) {
                      try { if (ok) pendingPerm.grant(pendingPerm.getResources()); else pendingPerm.deny(); } catch (Exception e) { /* ignore */ }
                      pendingPerm = null;
                  }
                  if (code == 79 && pendingGeo != null) {
                      try { pendingGeo.invoke(pendingGeoOrigin, ok, false); } catch (Exception e) { /* ignore */ }
                      pendingGeo = null;
                  }
              }

              // ----- crash log: the next start offers to send the error to the developer -----
              void installCrashLog() {
                  final Thread.UncaughtExceptionHandler old = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                      @Override public void uncaughtException(Thread th, Throwable e) {
                          try {
                              java.io.StringWriter sw = new java.io.StringWriter();
                              e.printStackTrace(new java.io.PrintWriter(sw));
                              String st = sw.toString();
                              prefs.edit().putString("last_crash", st.length() > 3500 ? st.substring(0, 3500) : st).commit();
                          } catch (Throwable ignored) { /* ignore */ }
                          if (old != null) old.uncaughtException(th, e);
                      }
                  });
              }

