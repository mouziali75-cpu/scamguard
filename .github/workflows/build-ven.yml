              boolean adsOn(String pageUrl) {
                  String h = hostOfUrl(pageUrl);
                  return sAds && !relaxed(h) && (sOwner || !Shield.adOff(h));   // the owner (logged in) keeps the ad blocker on everywhere
              }

              boolean sOwner;
              long ownerChecked;

              /** asks the site if the Discord login inside Ven belongs to the bot owner */
              void checkOwner() {
                  ownerChecked = System.currentTimeMillis();
                  new Thread(new Runnable() {
                      @Override public void run() {
                          try {
                              String ck = CookieManager.getInstance().getCookie("https://ticoo.wispbyte.org");
                              boolean own = false;
                              if (ck != null && !ck.isEmpty()) {
                                  HttpURLConnection con = (HttpURLConnection) new URL("https://ticoo.wispbyte.org/ven/owner/status").openConnection();
                                  con.setConnectTimeout(8000);
                                  con.setReadTimeout(8000);
                                  con.setRequestProperty("Cookie", ck);
                                  if (con.getResponseCode() != 200) { con.disconnect(); return; }   // keep the old value
                                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                                  InputStream in = con.getInputStream();
                                  byte[] buf = new byte[1024];
                                  int n;
                                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                                  in.close();
                                  con.disconnect();
                                  own = bo.toString("UTF-8").contains("\"owner\":true");
                              }
                              prefs.edit().putBoolean("is_owner", own).apply();
                              sOwner = own;
                          } catch (Exception e) { /* offline: keep the old value */ }
                      }
                  }).start();
              }
              boolean relaxed(String host) {
                  return host != null && !host.isEmpty() && (off(host) || Shield.isTrusted(host.toLowerCase()));
