              }
              boolean off(String host) {
                  if (host == null || host.isEmpty()) return false;
                  return siteOff.contains(regDomain(host.toLowerCase()));
              }
              /** trusted big sites (Discord, Google, ...) or sites the user allowed: no page scripts / redirect / cookie limits */
