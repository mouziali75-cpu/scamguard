              EditText field(String hint, boolean multi) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setHintTextColor(C_MUTED);
                  e.setTextColor(C_TEXT);
                  e.setTextSize(15);
                  e.setBackground(rounded(C_PILL, 12));
                  e.setPadding(dp(14), dp(12), dp(14), dp(12));
                  if (multi) { e.setMinLines(5); e.setGravity(Gravity.TOP); e.setInputType(android.text.InputType.TYPE_CLASS_TEXT | android.text.InputType.TYPE_TEXT_FLAG_MULTI_LINE); }
                  else e.setSingleLine(true);
                  return e;
              }

              void showFeedback(String presetType, String presetUrl) {
                  final Dialog d = newFull();
                  LinearLayout[] sh = shell(d, S.t("fb_title"));
                  LinearLayout p = new LinearLayout(this);
                  p.setOrientation(LinearLayout.VERTICAL);
                  p.setPadding(dp(16), dp(14), dp(16), dp(30));
                  ScrollView sv = new ScrollView(this);
                  sv.addView(p);
                  sh[0].addView(sv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  final String[] keys = {"bug", "idea", "site", "other"};
                  final String[] labels = {S.t("fb_bug"), S.t("fb_idea"), S.t("fb_site"), S.t("fb_other")};
                  final int[] sel = {0};
                  for (int i = 0; i < keys.length; i++) if (keys[i].equals(presetType)) sel[0] = i;
                  final TextView[] chips = new TextView[4];
                  final Runnable paint = new Runnable() {
                      @Override public void run() {
                          for (int i = 0; i < chips.length; i++) {
                              chips[i].setBackground(rounded(i == sel[0] ? C_ACCENT : C_PILL, 18));
                              chips[i].setTextColor(i == sel[0] ? 0xFFFFFFFF : C_TEXT);
                          }
                      }
                  };
                  for (int r = 0; r < 2; r++) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      for (int c = 0; c < 2; c++) {
                          final int idx = r * 2 + c;
                          TextView ch = text(labels[idx], 14, C_TEXT);
                          ch.setGravity(Gravity.CENTER);
                          ch.setPadding(dp(8), dp(11), dp(8), dp(11));
                          ch.setOnClickListener(new View.OnClickListener() {
                              @Override public void onClick(View v) { sel[0] = idx; paint.run(); }
                          });
                          chips[idx] = ch;
                          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, -2, 1f);
                          lp.setMargins(dp(4), dp(4), dp(4), dp(4));
                          row.addView(ch, lp);
                      }
                      p.addView(row, new LinearLayout.LayoutParams(-1, -2));
                  }
                  paint.run();
                  final String[] ckeys = {"adult", "scam", "malware", "ads", "other"};
                  final int[] csel = {0};
                  final TextView[] cchips = new TextView[5];
                  final LinearLayout catBox = new LinearLayout(this);
                  catBox.setOrientation(LinearLayout.VERTICAL);
                  catBox.addView(text(S.t("rc_title"), 13, C_MUTED));
                  final android.widget.HorizontalScrollView chs = new android.widget.HorizontalScrollView(this);
                  chs.setHorizontalScrollBarEnabled(false);
                  LinearLayout crow = new LinearLayout(this);
                  crow.setOrientation(LinearLayout.HORIZONTAL);
                  chs.addView(crow);
                  final Runnable cpaint = new Runnable() {
                      @Override public void run() {
                          for (int i = 0; i < cchips.length; i++) {
                              cchips[i].setBackground(rounded(i == csel[0] ? C_ACCENT : C_PILL, 18));
                              cchips[i].setTextColor(i == csel[0] ? 0xFFFFFFFF : C_TEXT);
                          }
                      }
                  };
                  for (int i = 0; i < ckeys.length; i++) {
                      final int ci = i;
                      TextView cc = text(S.t("rc_" + ckeys[i]), 13, C_TEXT);
                      cc.setPadding(dp(14), dp(9), dp(14), dp(9));
                      cc.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { csel[0] = ci; cpaint.run(); }
                      });
                      cchips[i] = cc;
                      LinearLayout.LayoutParams cl = new LinearLayout.LayoutParams(-2, -2);
                      cl.setMargins(dp(4), dp(6), dp(4), dp(2));
                      crow.addView(cc, cl);
                  }
                  cpaint.run();
                  catBox.addView(chs, new LinearLayout.LayoutParams(-1, -2));
                  LinearLayout.LayoutParams cbl = new LinearLayout.LayoutParams(-1, -2);
                  cbl.setMargins(dp(4), dp(8), dp(4), 0);
                  p.addView(catBox, cbl);
                  catBox.setVisibility("site".equals(presetType) ? View.VISIBLE : View.GONE);
                  for (int i = 0; i < chips.length; i++) {
                      final int idx = i;
                      final View.OnClickListener prev = null;
                      chips[i].setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { sel[0] = idx; paint.run(); catBox.setVisibility(idx == 2 ? View.VISIBLE : View.GONE); }
                      });
                  }
                  final EditText msg = field(S.t("fb_msg_hint"), true);
                  final EditText contact = field(S.t("fb_contact_hint"), false);
                  contact.setText(prefs.getString("acc_name", ""));
                  final EditText link = field(S.t("fb_url_hint"), false);
                  link.setText(presetUrl == null ? "" : presetUrl);
                  LinearLayout.LayoutParams fl = new LinearLayout.LayoutParams(-1, -2);
                  fl.setMargins(dp(4), dp(12), dp(4), 0);
                  p.addView(msg, fl);
                  p.addView(contact, fl);
                  p.addView(link, fl);
                  final TextView send = text(S.t("fb_send"), 16, 0xFFFFFFFF);
                  send.setGravity(Gravity.CENTER);
                  send.setBackground(rounded(C_ACCENT, 14));
                  send.setPadding(dp(10), dp(14), dp(10), dp(14));
                  send.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          final String m = msg.getText().toString().trim();
                          if (m.length() < 5) { toast(S.t("fb_short")); return; }
                          send.setEnabled(false);
                          final String cat = sel[0] == 2 ? ckeys[csel[0]] : "";
                          final String type = keys[sel[0]], ct = contact.getText().toString().trim(), lk = link.getText().toString().trim();
                          new Thread(new Runnable() {
                              @Override public void run() {
                                  final int code = Feedback.send(prefs, type, m, ct, lk, "Ven " + VERSION, cat);
                                  ui.post(new Runnable() {
                                      @Override public void run() {
                                          send.setEnabled(true);
                                          if (code == 200) { toast(S.t("fb_sent")); d.dismiss(); }
                                          else toast(S.t(code == 503 ? "fb_off" : code == 429 ? "fb_slow" : "fb_fail"));
                                      }
                                  });
                              }
                          }).start();
                      }
                  });
                  LinearLayout.LayoutParams sl = new LinearLayout.LayoutParams(-1, -2);
                  sl.setMargins(dp(4), dp(18), dp(4), 0);
                  p.addView(send, sl);
                  showFull(d);
              }

              // ----- userscripts -----
              void inputDialog(String title, boolean multi, String initial, final StrCb cb) {
                  final EditText et = new EditText(this);
                  et.setText(initial);
                  et.setTextColor(0xFFFFFFFF);
                  if (multi) { et.setMinLines(5); et.setGravity(Gravity.TOP); et.setInputType(android.text.InputType.TYPE_CLASS_TEXT | android.text.InputType.TYPE_TEXT_FLAG_MULTI_LINE); }
                  else { et.setSingleLine(true); et.setInputType(android.text.InputType.TYPE_CLASS_TEXT | android.text.InputType.TYPE_TEXT_VARIATION_URI); }
                  FrameLayout w = new FrameLayout(this);
                  w.setPadding(dp(20), dp(8), dp(20), 0);
                  w.addView(et);
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(title)
                          .setView(w)
                          .setNegativeButton(S.t("cancel"), null)
                          .setPositiveButton(S.t("ok2"), new android.content.DialogInterface.OnClickListener() {
                              @Override public void onClick(android.content.DialogInterface di, int which) { cb.on(et.getText().toString()); }
                          }).show();
