              static void paintDots(MainActivity a, TextView[] dots, int on) {
                  for (int i = 0; i < dots.length; i++) if (dots[i] != null) dots[i].setTextColor(i == on ? MainActivity.C_ACCENT : 0x55FFFFFF);
