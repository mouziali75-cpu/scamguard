                      @Override public void run() { showFeedback("bug", ""); }
                  });

                  ScrollView sv = new ScrollView(this);
                  sv.addView(box);
                  int w = getResources().getDisplayMetrics().widthPixels;
                  box.measure(View.MeasureSpec.makeMeasureSpec(w, View.MeasureSpec.EXACTLY),
                          View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED));
                  int maxH = (int) (getResources().getDisplayMetrics().heightPixels * 0.75f);
                  int h = Math.min(box.getMeasuredHeight(), maxH);
                  menu = new PopupWindow(sv, w, h, true);
                  menu.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                  menu.setOutsideTouchable(true);
                  menu.setElevation(dp(12));
                  menu.showAtLocation(root, Gravity.BOTTOM, 0, 0);
