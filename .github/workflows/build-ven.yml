          final class DlScan {
              private DlScan() { }

              static final class Result {
                  int level;                                              // 0 = no problem, 1 = be careful, 2 = dangerous
                  final ArrayList<String[]> why = new ArrayList<>();      // {level, S key, parameter}
                  String sha = "";

                  void add(int lv, String key, String param) {
                      if (lv > level) level = lv;
                      why.add(new String[]{String.valueOf(lv), key, param == null ? "" : param});
                  }

                  String pack() {
                      StringBuilder b = new StringBuilder();
                      b.append(level).append('\u0001').append(sha);
                      for (String[] w : why) b.append('\u0001').append(w[0]).append('\u0003').append(w[1]).append('\u0003').append(w[2]);
                      return b.toString();
                  }

                  static Result unpack(String s) {
                      if (s == null || s.isEmpty()) return null;
                      Result r = new Result();
                      String[] p = s.split("\u0001", -1);
                      if (p.length < 2) return null;
                      try { r.level = Integer.parseInt(p[0]); } catch (Exception e) { return null; }
                      r.sha = p[1];
                      for (int i = 2; i < p.length; i++) {
                          String[] w = p[i].split("\u0003", -1);
                          if (w.length == 3) r.why.add(w);
                      }
