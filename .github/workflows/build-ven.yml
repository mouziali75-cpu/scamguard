                  if (!partial && !r.sha.isEmpty()) {
                      try {
                          HttpURLConnection con = (HttpURLConnection) new URL(Account.BASE + "/ven/scan?h=" + r.sha).openConnection();
                          con.setConnectTimeout(8000);
                          con.setReadTimeout(12000);
