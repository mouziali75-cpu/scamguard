                          for (String line : code.substring(a, b).split("\n")) {
                              line = line.trim();
                              if (!line.startsWith("//")) continue;
                              line = line.substring(2).trim();
                              if (!line.startsWith("@")) continue;
                              int sp = line.indexOf(' ');
                              String key = sp < 0 ? line : line.substring(0, sp);
                              String val = sp < 0 ? "" : line.substring(sp + 1).trim();
                              if (key.equals("@name") && name.isEmpty()) name = val;
                              else if (key.equals("@version")) ver = val;
                              else if ((key.equals("@match") || key.equals("@include")) && !val.isEmpty()) m.put(glob2re(val));
                              else if ((key.equals("@exclude") || key.equals("@exclude-match")) && !val.isEmpty()) x.put(glob2re(val));
