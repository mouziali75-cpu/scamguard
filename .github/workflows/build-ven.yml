                      ParcelFileDescriptor pfd = dm.openDownloadedFile(id);
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeFileDescriptor(pfd.getFileDescriptor(), null, o);
                      pfd.close();
                      int s = 1;
                      while (o.outWidth / (s * 2) >= 200 && o.outHeight / (s * 2) >= 200) s *= 2;
                      o = new BitmapFactory.Options();
                      o.inSampleSize = s;
                      pfd = dm.openDownloadedFile(id);
                      Bitmap b = BitmapFactory.decodeFileDescriptor(pfd.getFileDescriptor(), null, o);
                      pfd.close();
                      return b;
                  } catch (Exception e) { return null; }
              }

