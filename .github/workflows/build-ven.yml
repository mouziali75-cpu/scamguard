              static void showMenu(final MainActivity a) {
                  if (a.cur == null) return;
                  final LinearLayout box = new LinearLayout(a);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setBackground(a.rounded(MainActivity.C_SHEET, 16));
                  box.setPadding(a.dp(6), a.dp(10), a.dp(6), a.dp(8));
                  box.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);

                  final int sw = a.getResources().getDisplayMetrics().widthPixels;
                  final int pw = sw - a.dp(12);
                  final int[] page = {0};
                  final TextView[] dots = new TextView[3];

                  final LinearLayout strip = new LinearLayout(a);
                  strip.setOrientation(LinearLayout.HORIZONTAL);
                  strip.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);

                  final HorizontalScrollView hs = new HorizontalScrollView(a) {
                      float sx;
                      int startScroll, startPage;
                      @Override public boolean onInterceptTouchEvent(MotionEvent e) {
                          if (e.getActionMasked() == MotionEvent.ACTION_DOWN) { sx = e.getRawX(); startScroll = getScrollX(); startPage = page[0]; }
                          return super.onInterceptTouchEvent(e);
                      }
                      @Override public boolean onTouchEvent(MotionEvent e) {
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_MOVE: {
                                  int x = startScroll + (int) (sx - e.getRawX());
                                  scrollTo(Math.max(0, Math.min(2 * pw, x)), 0);
                                  return true;
                              }
                              case MotionEvent.ACTION_UP:
                              case MotionEvent.ACTION_CANCEL: {
                                  float dx = e.getRawX() - sx;
                                  int t = startPage;
                                  if (dx < -a.dp(50)) t++; else if (dx > a.dp(50)) t--;
                                  t = Math.max(0, Math.min(2, t));
                                  page[0] = t;
                                  smoothScrollTo(t * pw, 0);
                                  paintDots(a, dots, t);
                                  return true;
                              }
                              default: return true;
                          }
                      }
                  };
                  hs.setHorizontalScrollBarEnabled(false);
                  hs.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  hs.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);
