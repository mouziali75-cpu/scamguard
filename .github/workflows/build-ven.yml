          package app.scamguard.browser;

          import java.net.URLEncoder;
          import java.util.ArrayList;

          /** Generates the internal pages served from https://sg.invalid/ */
          final class Pages {
              static final String HOST = "sg.invalid";
              static final String BASE = "https://sg.invalid/";

              static String esc(String s) {
                  if (s == null) return "";
                  return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;");
              }

              /** An image set by the owner for this emoji, or the emoji itself. */
              static String ic(String key, String fallback) {
                  String u = Shield.icon(key);
                  if (u != null) return "<img class=\"ei\" alt=\"\" src=\"" + esc(u) + "\">";
                  return esc(fallback);
              }

              static String enc(String s) {
                  try { return URLEncoder.encode(s, "UTF-8"); } catch (Exception e) { return ""; }
              }

              private static String head(String title, String accent) {
                  String dir = S.rtl() ? "rtl" : "ltr";
                  return "<!DOCTYPE html><html dir=\"" + dir + "\"><head><meta charset=\"utf-8\">"
                          + "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">"
                          + "<title>" + esc(title) + "</title><style>"
                          + "*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}"
                          + "body{margin:0;background:#0D0B14;color:#e8eaf0;font-family:sans-serif;min-height:100vh;"
                          + "display:flex;flex-direction:column;align-items:center;padding:28px 18px}"
                          + ".card{width:100%;max-width:460px;background:#15121F;border:1px solid #2B2540;border-radius:20px;padding:24px}"
                          + "h1{font-size:21px;margin:12px 0 8px;color:" + accent + "}"
                          + "p{color:#aab0c0;line-height:1.5;font-size:15px;margin:6px 0}"
                          + ".ico{font-size:54px;text-align:center}"
                          + ".ei{width:1em;height:1em;object-fit:contain;vertical-align:-0.12em}"
                          + "ul{padding-inline-start:20px;color:#c8cddb;font-size:14px;line-height:1.6}"
                          + ".url{word-break:break-all;background:#0D0B14;border-radius:10px;padding:10px;font-size:13px;color:#8d95aa;margin:12px 0}"
                          + ".btn{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:14px;font-size:16px;font-weight:bold;margin-top:12px}"
                          + ".primary{background:" + accent + ";color:#fff}"
                          + ".ghost{background:transparent;border:1px solid #333a4d;color:#aab0c0;font-weight:normal;font-size:14px}"
                          + "</style></head><body>";
              }

              static String blocked(String url, Shield.Result r, boolean extraRta) {
                  String cat = r.category == null ? "unwanted" : r.category;
                  boolean pay = cat.equals("payment");
                  String accent = pay ? "#f59e0b" : cat.equals("adult") ? "#e0568a" : "#e5484d";
                  String icon = pay ? ic("payment", "💳") : cat.equals("adult") ? ic("adult", "🔞") : ic("shield", "🛡️");
                  String title = S.t("warn_" + cat);
                  StringBuilder sb = new StringBuilder(head(title, accent));
                  sb.append("<div class=\"card\"><div class=\"ico\">").append(icon).append("</div>");
                  sb.append("<h1>").append(esc(title)).append("</h1>");
                  sb.append("<div class=\"url\">").append(esc(url)).append("</div>");
                  sb.append("<p><b>").append(esc(S.t("warn_why"))).append("</b></p><ul>");
                  ArrayList<String[]> fl = new ArrayList<>(r.flags);
                  if (extraRta) fl.add(new String[]{"flag_rta", ""});
                  for (String[] f : fl) {
                      String txt = S.t(f[0]).replace("{b}", f[1]);
                      sb.append("<li>").append(esc(txt)).append("</li>");
                  }
                  sb.append("</ul>");
                  sb.append("<a class=\"btn primary\" href=\"").append(BASE).append("leave\">").append(esc(S.t("warn_leave"))).append("</a>");
                  if (!pay) sb.append("<a class=\"btn ghost\" href=\"").append(BASE).append("continue?u=").append(enc(url)).append("\">")
                          .append(esc(S.t("warn_continue"))).append("</a>");
                  sb.append("</div></body></html>");
                  return sb.toString();
              }

              static String error(String url, String desc, boolean ssl) {
                  String title = ssl ? S.t("ssl_title") : S.t("err_title");
                  String body = ssl ? S.t("ssl_msg") : desc;
                  StringBuilder sb = new StringBuilder(head(title, ssl ? "#e5484d" : "#7c4dff"));
                  sb.append("<div class=\"card\"><div class=\"ico\">").append(ssl ? ic("lock", "🔒") : ic("offline", "📡")).append("</div>");
                  sb.append("<h1>").append(esc(title)).append("</h1>");
                  sb.append("<div class=\"url\">").append(esc(url)).append("</div>");
                  sb.append("<p>").append(esc(body)).append("</p>");
                  if (!ssl) {
                      sb.append("<a class=\"btn primary\" href=\"").append(BASE).append("retry?u=").append(enc(url)).append("\">")
                              .append(esc(S.t("err_retry"))).append("</a>");
                  } else {
                      sb.append("<a class=\"btn primary\" href=\"").append(BASE).append("leave\">").append(esc(S.t("warn_leave"))).append("</a>");
                  }
                  sb.append("</div></body></html>");
                  return sb.toString();
              }

              static String home(int ads, int threats) {
                  String[][] tiles = {
                          {"Google", "https://www.google.com/", ic("tile_google", "G")},
                          {"YouTube", "https://www.youtube.com/", ic("tile_youtube", "▶")},
                          {"Wikipedia", "https://www.wikipedia.org/", ic("tile_wikipedia", "W")},
                          {"GitHub", "https://github.com/", ic("tile_github", "⌘")},
                          {"Discord", "https://discord.gg/kz4mpxw4Ga", ic("tile_discord", "💬")}
                  };
                  StringBuilder sb = new StringBuilder(head("Ven", "#7c4dff"));
                  sb.append("<style>.logo{font-size:64px;margin-top:30px}.t{font-size:26px;font-weight:bold;margin:6px 0 2px}"
                          + ".sub{color:#8d95aa;font-size:14px;margin-bottom:22px}"
                          + "form{width:100%;max-width:460px}"
                          + "input{width:100%;background:#15121F;border:1px solid #2B2540;border-radius:28px;padding:15px 20px;font-size:16px;color:#e8eaf0;outline:none}"
                          + ".grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:26px;max-width:460px}"
                          + ".tile{width:76px;text-align:center;text-decoration:none;color:#c8cddb;font-size:12px}"
                          + ".tile span{display:flex;width:56px;height:56px;margin:0 auto 6px;border-radius:50%;background:#201B2E;"
                          + "align-items:center;justify-content:center;font-size:22px;color:#7c4dff}"
                          + ".tile span .ei{width:34px;height:34px;border-radius:8px}"
                          + ".stats .ei{width:1.3em;height:1.3em}</style>");
                  sb.append("<style>.stats{margin-top:34px;color:#6f778c;font-size:13px;text-align:center}</style>");
                  sb.append("<div class=\"logo\">").append(ic("logo", "🛡️")).append("</div><div class=\"t\">Ven</div><div class=\"sub\">")
                          .append(esc(S.t("tagline"))).append("</div>");
                  sb.append("<form onsubmit=\"var q=document.getElementById('q').value;if(q){location.href='").append(BASE)
                          .append("search?q='+encodeURIComponent(q);}return false;\">");
                  sb.append("<input id=\"q\" type=\"text\" autocomplete=\"off\" placeholder=\"").append(esc(S.t("search_hint"))).append("\"></form>");
                  sb.append("<div class=\"grid\">");
                  for (String[] t : tiles) {
                      sb.append("<a class=\"tile\" href=\"").append(t[1]).append("\"><span>").append(t[2]).append("</span>")
                              .append(t[0]).append("</a>");
                  }
                  sb.append("</div>");
                  String st = S.t("stats").replace("{a}", String.valueOf(ads)).replace("{t}", String.valueOf(threats));
                  sb.append("<div class=\"stats\">").append(ic("shield", "🛡️")).append(" ").append(esc(st)).append("<br><br>").append(esc(S.t("copyright"))).append("</div>");
                  sb.append("</body></html>");
                  return sb.toString();
              }
          }
