              void switchRow(LinearLayout p, String title, String desc, final String key, boolean def, final Runnable after) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(18), dp(10), dp(18), dp(10));
                  row.setBackground(ripple());
                  LinearLayout tx = new LinearLayout(this);
                  tx.setOrientation(LinearLayout.VERTICAL);
                  tx.addView(text(title, 16, C_TEXT));
                  TextView ds = text(desc, 12, C_MUTED);
                  ds.setPadding(0, dp(2), 0, 0);
                  tx.addView(ds);
                  row.addView(tx, new LinearLayout.LayoutParams(0, -2, 1f));
                  final Switch sw = new Switch(this);
                  sw.setChecked(prefs.getBoolean(key, def));
                  sw.setThumbTintList(new ColorStateList(new int[][]{{android.R.attr.state_checked}, {}},
                          new int[]{C_ACCENT, 0xFFB0B6C6}));
                  sw.setTrackTintList(new ColorStateList(new int[][]{{android.R.attr.state_checked}, {}},
                          new int[]{0x887c4dff, 0x55FFFFFF}));
                  sw.setOnCheckedChangeListener(new android.widget.CompoundButton.OnCheckedChangeListener() {
                      @Override public void onCheckedChanged(android.widget.CompoundButton b, boolean on) {
                          prefs.edit().putBoolean(key, on).apply();
                          loadSettings();
                          applyAllSettings();
                          if (after != null) after.run();
                      }
                  });
                  row.addView(sw);
                  row.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { sw.toggle(); }
                  });
                  p.addView(row, new LinearLayout.LayoutParams(-1, -2));
              }

