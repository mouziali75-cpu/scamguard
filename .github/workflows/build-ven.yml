              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  if (handleAuth(intent)) return;
                  Uri d = intent.getData();
                  if (d != null) newTab(d.toString(), true);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  saveTabs();
                  if (Account.signedIn(prefs)) new Thread(new Runnable() { @Override public void run() { Account.sync(prefs); } }).start();
              }

              @Override
              protected void onDestroy() {
                  Extras.destroy(this);
                  saveTabs();
                  if (isFinishing() && prefs.getBoolean("clearexit", false)) {
                      try { CookieManager.getInstance().removeAllCookies(null); WebStorage.getInstance().deleteAllData(); } catch (Exception e) { /* ignore */ }
                      for (Tab t : tabs) { try { t.web.clearCache(true); t.web.clearHistory(); } catch (Exception e) { /* ignore */ } }
                      prefs.edit().remove("hist").remove("tabs").remove("cur").apply();
                  }
                  for (Tab t : tabs) {
                      try { webHolder.removeView(t.web); t.web.destroy(); } catch (Exception e) { /* ignore */ }
                  }
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) { hideCustom(); return; }
                  if (fullscreen) { fullscreen = false; applyFullscreen(); return; }
                  if (menu != null && menu.isShowing()) { menu.dismiss(); return; }
                  if (findBar.getVisibility() == View.VISIBLE) { closeFind(); return; }
                  if (cur == null) { finish(); return; }
                  if (urlBox.hasFocus()) { urlBox.clearFocus(); hideKb(); return; }
                  if (goBackSmart(cur)) return;
                  if (tabs.size() > 1) { closeTab(cur); return; }
                  if (cur.web.canGoBack() && cur.url != null && !cur.url.startsWith(Pages.BASE + "home")) { loadHome(cur); return; }
                  finish();
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 77 && fileCb != null) {
                      Uri[] r = WebChromeClient.FileChooserParams.parseResult(res, data);
                      fileCb.onReceiveValue(r);
                      fileCb = null;
                  }
              }

              void applyOrientation() {
                  int o = prefs.getInt("orient", 0);
                  setRequestedOrientation(o == 1 ? android.content.pm.ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                          : o == 2 ? android.content.pm.ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                          : android.content.pm.ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
              }

              void setBars(boolean show) {
                  if (fullscreen || topBar == null || bottomBar == null) return;
                  int vis = show ? View.VISIBLE : View.GONE;
                  if (topBar.getVisibility() != vis) topBar.setVisibility(vis);
                  if (bottomBar.getVisibility() != vis) bottomBar.setVisibility(vis);
              }

              void applyFullscreen() {
                  int vis = fullscreen ? View.GONE : View.VISIBLE;
                  topBar.setVisibility(vis);
                  bottomBar.setVisibility(vis);
                  getWindow().getDecorView().setSystemUiVisibility(fullscreen
                          ? (View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
                          : View.SYSTEM_UI_FLAG_VISIBLE);
              }

              void captureThumb(Tab t) {
