                      int n;
                      while ((n = in.read(buf)) > 0) {
                          bo.write(buf, 0, n);
                          if (bo.size() > 12 * 1024 * 1024) { in.close(); con.disconnect(); return null; }
                      }
                      in.close();
                      con.disconnect();
                      return bo.toString("UTF-8");
                  } catch (Exception e) { return null; }
              }

