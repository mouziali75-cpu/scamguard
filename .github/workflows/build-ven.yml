              void restoreTabs(Intent intent) {
                  int ci = prefs.getInt("cur", 0);
                  try {
                      JSONArray a = new JSONArray(prefs.getBoolean("restore", true) ? prefs.getString("tabs", "[]") : "[]");
                      for (int i = 0; i < a.length(); i++) newTab(a.optString(i, ""), false);
                  } catch (Exception e) { /* ignore */ }
                  if (tabs.isEmpty()) newTab(null, false);
                  if (ci < 0 || ci >= tabs.size()) ci = 0;
                  switchTo(tabs.get(ci));
                  Uri d = intent == null ? null : intent.getData();
                  if (d != null && !"ven".equals(d.getScheme())) newTab(d.toString(), true);
                  handleAuth(intent);
              }

              // ================= account (Google / Discord) =================
              /** the sign-in page sends the browser back to ven://auth?code=... */
              boolean handleAuth(Intent intent) {
                  Uri d = intent == null ? null : intent.getData();
                  if (d == null || !"ven".equals(d.getScheme())) return false;
                  final String code = d.getQueryParameter("code");
                  if (code == null || code.isEmpty()) return true;
                  new Thread(new Runnable() {
                      @Override public void run() {
                          final boolean ok = Account.exchange(prefs, code);
                          if (ok) Account.sync(prefs);
                          ui.post(new Runnable() {
                              @Override public void run() {
                                  toast(S.t(ok ? "acc_in_ok" : "acc_in_fail"));
                                  if (ok) { loadSettings(); applyAllSettings(); }
                              }
                          });
                      }
                  }).start();
                  return true;
              }

              void syncNow(final boolean loud) {
                  if (!Account.signedIn(prefs)) return;
                  new Thread(new Runnable() {
